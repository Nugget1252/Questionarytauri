name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            build-cmd: 'npm run build:win'
            artifact-path: |
              dist/*.exe

          - platform: macos-latest
            build-cmd: 'npm run build:mac'
            artifact-path: |
              dist/*.dmg
              dist/*.zip

          - platform: ubuntu-22.04
            build-cmd: 'npm run build:linux'
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux Packaging Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot xvfb libarchive-tools

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Electron Binaries (Linux with xvfb)
        if: matrix.platform == 'ubuntu-22.04'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" ${{ matrix.build-cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron Binaries (Windows / macOS)
        if: matrix.platform != 'ubuntu-22.04'
        run: ${{ matrix.build-cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact-path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
