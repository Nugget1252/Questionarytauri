name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            build-cmd: 'npm run build:win'
            artifact-path: 'dist/*.exe'

          - platform: macos-latest
            build-cmd: 'npm run build:mac'
            artifact-path: |
              dist/*.dmg
              dist/*.zip

          - platform: ubuntu-22.04
            build-cmd: 'npm run build:linux'
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux Packaging Tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot xvfb libarchive-tools

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron Binaries (Linux with xvfb)
        if: matrix.platform == 'ubuntu-22.04'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" ${{ matrix.build-cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron Binaries (Windows / macOS)
        if: matrix.platform != 'ubuntu-22.04'
        run: ${{ matrix.build-cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact-path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;34.0.0" \
            "platform-tools" \
            "platforms;android-34"

      - name: Install Node Dependencies
        run: npm ci

      - name: Initialize or Sync Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Release APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Android APK
        run: |
          mkdir -p release-apks
          VERSION="${GITHUB_REF_NAME#v}"
          
          # Generate CI signing key
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias android-release -storepass android -keypass android \
            -dname "CN=Questionary, OU=CI, O=Questionary, L=CI, S=CI, C=US"

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          if [ -f "$UNSIGNED_APK" ]; then
            $APKSIGNER sign --ks release.jks --ks-pass pass:android --ks-key-alias android-release "$UNSIGNED_APK"
            cp "$UNSIGNED_APK" "release-apks/Questionary-${VERSION}.apk"
          fi

      - name: Upload Android APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: 'release-apks/*.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}