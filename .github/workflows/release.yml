name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            build-cmd: 'npm run build:win'
            artifact-path: 'dist/*.exe'

          - platform: macos-latest
            build-cmd: 'npm run build:mac'
            artifact-path: |
              dist/*.dmg
              dist/*.zip

          - platform: ubuntu-22.04
            build-cmd: 'npm run build:linux'
            artifact-path: |
              dist/*.AppImage
              dist/*.deb
              dist/*.rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux Packaging Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot xvfb zip libarchive-tools

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Electron Binaries (Linux with xvfb)
        if: matrix.platform == 'ubuntu-22.04'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" ${{ matrix.build-cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron Binaries (Windows / macOS)
        if: matrix.platform != 'ubuntu-22.04'
        run: ${{ matrix.build-cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only pack document zips once on the Ubuntu runner to avoid duplication
      - name: Package Document ZIP Packs
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          # Package SD
          zip -r documents-sd.zip documents/

          # Package HD (ensuring the internal folder is named 'documents')
          mkdir -p temp_hd_stage/documents
          cp -r documentshd/* temp_hd_stage/documents/
          cd temp_hd_stage && zip -r ../documents-hd.zip documents/ && cd ..
          rm -rf temp_hd_stage

      - name: Upload Desktop Artifacts & Doc Packs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ matrix.artifact-path }}
            ${{ matrix.platform == 'ubuntu-22.04' && 'documents-sd.zip' || '' }}
            ${{ matrix.platform == 'ubuntu-22.04' && 'documents-hd.zip' || '' }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
