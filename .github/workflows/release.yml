name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust-target: ''
            tauri-args: '--bundles nsis'
            artifact-path: 'src-tauri/target/release/bundle/nsis/*.exe'

          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            tauri-args: '--target x86_64-apple-darwin --bundles dmg'
            artifact-path: 'src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg'

          - platform: ubuntu-22.04
            rust-target: ''
            tauri-args: '--bundles deb,appimage,rpm'
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install frontend dependencies
        run: npm install

      - name: Build Desktop Binaries
        run: npx tauri build ${{ matrix.tauri-args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Desktop Assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact-path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    needs: release-desktop
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 27 and build tools
        run: |
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            "build-tools;34.0.0" \
            "platform-tools" \
            "platforms;android-34"

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android
            armv7-linux-androideabi
            i686-linux-android
            x86_64-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Clean up old Android templates
        run: rm -rf src-tauri/gen/android

      - name: Init Android project
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "y" | npx tauri android init
          fi
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Build Android APK
        run: npx tauri android build --apk
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/27.0.12077973

      - name: Sign and Package Android APKs
        run: |
          mkdir -p release-apks
          # Extract version directly from Git Tag (e.g. v0.8.0 -> 0.8.0)
          VERSION="${GITHUB_REF_NAME#v}"

          KEYSTORE="ci-release.jks"
          KEY_PASS="password123"
          KEY_ALIAS="ci-key"

          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using custom keystore from GitHub Secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            KEY_PASS="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
          else
            echo "Generating release keystore in CI..."
            keytool -genkey -v -keystore "$KEYSTORE" -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" -storepass "$KEY_PASS" -keypass "$KEY_PASS" \
              -dname "CN=Questionary, OU=CI, O=Questionary, L=CI, S=CI, C=US"
          fi

          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner"

          for apk in $(find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk"); do
            filename=$(basename "$apk")
            echo "Signing $filename with apksigner..."

            $APKSIGNER sign \
              --ks "$KEYSTORE" \
              --ks-pass "pass:$KEY_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              "$apk"

            $APKSIGNER verify "$apk"

            arch_name=$(echo "$filename" | sed 's/app-//g' | sed 's/-release-unsigned//g' | sed 's/-release//g' | sed 's/\.apk//g')
            target_name="Questionary-${VERSION}-${arch_name}.apk"

            cp "$apk" "release-apks/$target_name"
            echo "Prepared signed APK: release-apks/$target_name"
          done

      - name: Upload Android APKs to Release
        uses: softprops/action-gh-release@v2
        with:
          files: 'release-apks/*.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}