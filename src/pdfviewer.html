<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PDF Viewer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #232527; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

/* Toolbar */
#toolbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #1e1f22; color: #c8ccd0; padding: 0 8px;
    display: flex; align-items: center; gap: 4px;
    font-size: 13px; border-bottom: 1px solid #2e3035;
    height: 40px; user-select: none;
    overflow-x: auto;
}
#toolbar button {
    background: transparent; color: #c8ccd0; border: 1px solid transparent;
    padding: 0 6px; cursor: pointer; border-radius: 4px; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    min-width: 32px; height: 30px; transition: background 0.15s;
    flex-shrink: 0;
}
#toolbar button:hover { background: #3c3f41; border-color: #4e5155; }
#toolbar button.active { background: #cf6215 !important; color: white !important; }
#toolbar input[type="number"] {
    width: 44px; text-align: center; padding: 1px 4px;
    border-radius: 4px; border: 1px solid #4e5155;
    background: #111113; color: #c8ccd0; font-size: 12px;
    height: 26px; -moz-appearance: textfield;
}
#toolbar input::-webkit-outer-spin-button,
#toolbar input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
#toolbar input:focus { outline: none; border-color: #cf6215; }
#annotationColor {
    width: 26px; height: 26px; border: none; border-radius: 4px;
    cursor: pointer; background: transparent; flex-shrink: 0;
}
.toolbar-sep { width: 1px; height: 20px; background: #3e4145; margin: 0 2px; flex-shrink: 0; }
.toolbar-spacer { flex: 1; min-width: 8px; }
.toolbar-label { font-size: 12px; color: #8b8f94; white-space: nowrap; }
#zoomSelect {
    background: #111113; color: #c8ccd0; border: 1px solid #4e5155;
    border-radius: 4px; padding: 1px 2px; font-size: 12px; height: 26px; cursor: pointer;
    flex-shrink: 0;
}

/* Loading Bar */
#loadingBar {
    position: fixed; top: 40px; left: 0; right: 0; height: 3px;
    background: transparent; z-index: 101;
}
#loadingProgress { height: 100%; width: 0%; background: #cf6215; transition: width 0.3s ease; }

/* Viewer Container */
#viewerContainer {
    position: absolute !important;
    top: 40px !important;
    bottom: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    overflow-x: auto !important;
    overflow-y: auto !important;
    padding: 15px 0 !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    box-sizing: border-box !important;
}

/* Page Wrapper */
.page-wrapper {
    position: relative !important;
    margin: 0 auto 15px auto !important;
    background: white !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5) !important;
    flex-shrink: 0 !important;
    user-select: none;
}

.page-wrapper canvas {
    display: block !important;
    margin: 0 auto !important;
}

/* Annotation Canvas Layer */
.annotation-canvas {
    position: absolute !important;
    top: 0 !important;
    left: 0 !important;
    z-index: 10 !important;
    touch-action: none;
    cursor: default;
}
.annotation-canvas.active-pen { cursor: crosshair; }
.annotation-canvas.active-highlighter { cursor: text; }
.annotation-canvas.active-eraser { cursor: cell; }

/* Text Note Overlay */
.pdf-text-note {
    position: absolute;
    z-index: 15;
    background: rgba(255, 251, 204, 0.95);
    border: 1px solid #e6db55;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    color: #222;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    min-width: 100px;
    outline: none;
}

.textLayer {
    position: absolute !important;
    left: 0 !important; top: 0 !important; right: 0 !important; bottom: 0 !important;
    overflow: hidden; opacity: 1 !important; line-height: 1.0 !important;
    z-index: 5 !important;
}
.textLayer span {
    color: transparent !important; background: transparent !important;
    position: absolute !important; white-space: pre !important; cursor: text !important;
}
.textLayer ::selection { background: rgba(0, 102, 255, 0.35) !important; }

#errorMessage { display: none; color: #f87171; text-align: center; padding: 60px 20px; font-size: 15px; }
#loadingMessage { color: #8b8f94; text-align: center; padding: 60px 20px; font-size: 14px; }
</style>
</head>
<body>

<div id="toolbar">
    <button id="prevPage" title="Previous Page"><i class="fas fa-chevron-left"></i></button>
    <input id="pageNum" type="number" value="1" min="1">
    <span class="toolbar-label">/ <span id="pageCount">-</span></span>
    <button id="nextPage" title="Next Page"><i class="fas fa-chevron-right"></i></button>
    
    <div class="toolbar-sep"></div>
    
    <button id="zoomOut" title="Zoom Out"><i class="fas fa-minus"></i></button>
    <select id="zoomSelect">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5" selected>150%</option>
        <option value="2">200%</option>
        <option value="auto">Fit Width</option>
    </select>
    <button id="zoomIn" title="Zoom In"><i class="fas fa-plus"></i></button>
    
    <div class="toolbar-sep"></div>

    <!-- PDF Annotations Tools -->
    <button id="toolPen" title="Pen Tool"><i class="fas fa-pen"></i></button>
    <button id="toolHighlight" title="Highlighter"><i class="fas fa-highlighter"></i></button>
    <button id="toolText" title="Add Text Note"><i class="fas fa-font"></i></button>
    <button id="toolEraser" title="Eraser"><i class="fas fa-eraser"></i></button>
    <input type="color" id="annotationColor" value="#ff2a00" title="Color">
    <button id="clearAnnotations" title="Clear Page Annotations"><i class="fas fa-trash-alt"></i></button>

    <div class="toolbar-spacer"></div>
    <button id="openNewTab" title="Open PDF in New Tab"><i class="fas fa-external-link-alt"></i></button>
</div>

<div id="loadingBar"><div id="loadingProgress"></div></div>

<div id="viewerContainer" class="pdfViewer">
    <div id="loadingMessage">Loading PDF...</div>
    <div id="errorMessage"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function() {
    'use strict';

    if (typeof pdfjsLib === 'undefined') {
        document.getElementById('loadingMessage').style.display = 'none';
        const err = document.getElementById('errorMessage');
        err.style.display = 'block';
        err.textContent = 'PDF.js library failed to load.';
        return;
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const viewerContainer = document.getElementById('viewerContainer');
    const pageNumInput = document.getElementById('pageNum');
    const pageCountSpan = document.getElementById('pageCount');
    const loadingProgress = document.getElementById('loadingProgress');
    const loadingMessage = document.getElementById('loadingMessage');
    const errorMessage = document.getElementById('errorMessage');
    const zoomSelect = document.getElementById('zoomSelect');

    let pdfDoc = null;
    let currentScale = 1.5;
    let pagePlaceholders = [];
    let totalPages = 0;
    let currentPageNum = 1;
    let globalRenderId = 0;
    let activeRenderTasks = {};

    // Annotation State
    let activeTool = null; // 'pen', 'highlighter', 'text', 'eraser'
    let strokeColor = '#ff2a00';

    const params = new URLSearchParams(window.location.search);
    let fileUrl = params.get('file');

    if (!fileUrl && window.location.hash) {
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        fileUrl = hashParams.get('file');
    }

    const hashMatch = (window.location.hash || '').match(/page=(\d+)/);
    const initialPage = (hashMatch ? parseInt(hashMatch[1]) : parseInt(params.get('page'))) || 1;

    function getEffectiveScale() {
        if (currentScale === 'auto') {
            const containerWidth = viewerContainer.clientWidth - 30;
            return Math.max(0.5, containerWidth / 612);
        }
        return parseFloat(currentScale);
    }

    function cancelAllRunningTasks() {
        Object.keys(activeRenderTasks).forEach(num => {
            const task = activeRenderTasks[num];
            if (task && typeof task.cancel === 'function') {
                try { task.cancel(); } catch(e) {}
            }
        });
        activeRenderTasks = {};
    }

    /* Virtual IntersectionObserver Engine for Ultra-Low Memory Usage */
    const pageObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            const wrapper = entry.target;
            const pageNum = parseInt(wrapper.dataset.pageNum, 10);
            if (entry.isIntersecting) {
                renderPageContent(pageNum, wrapper);
            } else {
                unloadPageContent(pageNum, wrapper);
            }
        });
    }, {
        root: viewerContainer,
        rootMargin: '300px 0px 300px 0px'
    });

    async function loadDocument(url) {
        try {
            loadingProgress.style.width = '20%';
            loadingMessage.textContent = 'Loading PDF...';

            if (pdfDoc) {
                try { pdfDoc.destroy(); } catch(e) {}
            }

            const loadingTask = pdfjsLib.getDocument({ url: url, cMapPacked: true });
            loadingTask.onProgress = function(progress) {
                if (progress.total > 0) {
                    loadingProgress.style.width = Math.min(70, (progress.loaded / progress.total) * 100) + '%';
                }
            };

            pdfDoc = await loadingTask.promise;
            totalPages = pdfDoc.numPages;
            pageCountSpan.textContent = totalPages;
            pageNumInput.max = totalPages;

            loadingProgress.style.width = '80%';
            await setupPlaceholders();

            loadingProgress.style.width = '100%';
            setTimeout(function() { loadingProgress.style.width = '0%'; }, 600);

            if (initialPage > 1 && initialPage <= totalPages) {
                setTimeout(function() { scrollToPage(initialPage); }, 100);
            }
        } catch (err) {
            console.error('Failed to load PDF:', err);
            loadingMessage.style.display = 'none';
            errorMessage.style.display = 'block';
            errorMessage.innerHTML = 'Failed to load PDF.<br><small>' + (err.message || err) + '</small>';
            loadingProgress.style.width = '0%';
        }
    }

    async function setupPlaceholders() {
        globalRenderId++;
        cancelAllRunningTasks();
        
        pageObserver.disconnect();
        viewerContainer.innerHTML = '';
        pagePlaceholders = [];

        const scale = getEffectiveScale();
        const firstPage = await pdfDoc.getPage(1);
        const sampleViewport = firstPage.getViewport({ scale: scale });

        for (let i = 1; i <= totalPages; i++) {
            const wrapper = document.createElement('div');
            wrapper.className = 'page-wrapper';
            wrapper.dataset.pageNum = i;
            wrapper.dataset.rendered = 'false';
            wrapper.style.width = Math.floor(sampleViewport.width) + 'px';
            wrapper.style.height = Math.floor(sampleViewport.height) + 'px';

            viewerContainer.appendChild(wrapper);
            pagePlaceholders.push(wrapper);
            pageObserver.observe(wrapper);
        }

        if (loadingMessage) loadingMessage.style.display = 'none';
    }

    async function renderPageContent(pageNum, wrapper) {
        if (wrapper.dataset.rendered === 'true' || wrapper.dataset.rendering === 'true') return;
        wrapper.dataset.rendering = 'true';

        const instanceId = globalRenderId;
        const scale = getEffectiveScale();

        try {
            const page = await pdfDoc.getPage(pageNum);
            if (instanceId !== globalRenderId) return;

            const viewport = page.getViewport({ scale: scale });
            wrapper.style.width = Math.floor(viewport.width) + 'px';
            wrapper.style.height = Math.floor(viewport.height) + 'px';

            const canvas = document.createElement('canvas');
            canvas.width = Math.floor(viewport.width);
            canvas.height = Math.floor(viewport.height);
            wrapper.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            const renderTask = page.render({ canvasContext: ctx, viewport: viewport });
            activeRenderTasks[pageNum] = renderTask;

            await renderTask.promise;
            delete activeRenderTasks[pageNum];

            if (instanceId !== globalRenderId) return;

            const textContent = await page.getTextContent();
            if (instanceId !== globalRenderId) return;

            const textLayerDiv = document.createElement('div');
            textLayerDiv.className = 'textLayer';
            textLayerDiv.style.width = Math.floor(viewport.width) + 'px';
            textLayerDiv.style.height = Math.floor(viewport.height) + 'px';
            textLayerDiv.style.setProperty('--scale-factor', scale);
            wrapper.appendChild(textLayerDiv);

            const textLayerTask = pdfjsLib.renderTextLayer({
                textContent: textContent,
                container: textLayerDiv,
                viewport: viewport,
                enhanceTextSelection: true
            });

            await textLayerTask.promise;

            // Setup Interactive Annotation Layer Canvas
            setupAnnotationCanvas(wrapper, pageNum, Math.floor(viewport.width), Math.floor(viewport.height));

            wrapper.dataset.rendered = 'true';
        } catch (err) {
            if (err.name !== 'RenderingCancelledException') {
                console.warn(`Page ${pageNum} render error:`, err);
            }
        } finally {
            wrapper.dataset.rendering = 'false';
        }
    }

    function unloadPageContent(pageNum, wrapper) {
        if (activeRenderTasks[pageNum]) {
            try { activeRenderTasks[pageNum].cancel(); } catch(e) {}
            delete activeRenderTasks[pageNum];
        }

        const canvas = wrapper.querySelector('canvas:not(.annotation-canvas)');
        if (canvas) {
            canvas.width = 0; canvas.height = 0;
            canvas.remove();
        }

        const textLayer = wrapper.querySelector('.textLayer');
        if (textLayer) textLayer.remove();

        const annotCanvas = wrapper.querySelector('.annotation-canvas');
        if (annotCanvas) annotCanvas.remove();

        wrapper.dataset.rendered = 'false';
        wrapper.dataset.rendering = 'false';
    }

    /* ================================================================
       PDF ANNOTATION DRAWING & PERSISTENCE ENGINE
       ================================================================ */
    function getAnnotationStorageKey(pageNum) {
        return `pdf-annot:${fileUrl}:${pageNum}`;
    }

    function setupAnnotationCanvas(wrapper, pageNum, width, height) {
        const annotCanvas = document.createElement('canvas');
        annotCanvas.className = 'annotation-canvas';
        annotCanvas.width = width;
        annotCanvas.height = height;
        annotCanvas.style.width = width + 'px';
        annotCanvas.style.height = height + 'px';
        wrapper.appendChild(annotCanvas);

        const ctx = annotCanvas.getContext('2d');
        loadSavedAnnotations(pageNum, ctx, width, height);

        let isDrawing = false;
        let lastX = 0, lastY = 0;

        function getPos(e) {
            const rect = annotCanvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * (width / rect.width),
                y: (clientY - rect.top) * (height / rect.height)
            };
        }

        function startDraw(e) {
            if (!activeTool) return;
            if (activeTool === 'text') {
                placeTextNote(wrapper, pageNum, e);
                return;
            }
            isDrawing = true;
            const pos = getPos(e);
            lastX = pos.x; lastY = pos.y;
            e.preventDefault();
        }

        function draw(e) {
            if (!isDrawing || !activeTool) return;
            const pos = getPos(e);

            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(pos.x, pos.y);

            if (activeTool === 'pen') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.stroke();
            } else if (activeTool === 'highlighter') {
                ctx.globalCompositeOperation = 'source-over';
                ctx.strokeStyle = strokeColor + '66'; // 40% Opacity
                ctx.lineWidth = 18;
                ctx.lineCap = 'square';
                ctx.stroke();
            } else if (activeTool === 'eraser') {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.lineWidth = 24;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            lastX = pos.x; lastY = pos.y;
            e.preventDefault();
        }

        function stopDraw() {
            if (isDrawing) {
                isDrawing = false;
                saveAnnotations(pageNum, annotCanvas);
            }
        }

        annotCanvas.addEventListener('pointerdown', startDraw);
        annotCanvas.addEventListener('pointermove', draw);
        annotCanvas.addEventListener('pointerup', stopDraw);
        annotCanvas.addEventListener('pointerleave', stopDraw);
    }

    function saveAnnotations(pageNum, canvas) {
        try {
            const dataUrl = canvas.toDataURL();
            localStorage.setItem(getAnnotationStorageKey(pageNum), dataUrl);
        } catch(e) {}
    }

    function loadSavedAnnotations(pageNum, ctx, width, height) {
        const savedData = localStorage.getItem(getAnnotationStorageKey(pageNum));
        if (savedData) {
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, width, height);
            };
            img.src = savedData;
        }
    }

    function placeTextNote(wrapper, pageNum, e) {
        const rect = wrapper.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        const note = document.createElement('div');
        note.className = 'pdf-text-note';
        note.contentEditable = 'true';
        note.style.left = x + 'px';
        note.style.top = y + 'px';
        note.textContent = 'Note...';

        wrapper.appendChild(note);
        note.focus();
    }

    // Toolbar Tool Selection Handlers
    function setTool(toolName) {
        activeTool = activeTool === toolName ? null : toolName;
        document.querySelectorAll('#toolbar button').forEach(btn => btn.classList.remove('active'));
        if (activeTool) {
            const activeBtn = document.getElementById('tool' + toolName.charAt(0).toUpperCase() + toolName.slice(1));
            if (activeBtn) activeBtn.classList.add('active');
        }
        document.querySelectorAll('.annotation-canvas').forEach(c => {
            c.className = 'annotation-canvas ' + (activeTool ? 'active-' + activeTool : '');
        });
    }

    document.getElementById('toolPen').addEventListener('click', () => setTool('pen'));
    document.getElementById('toolHighlight').addEventListener('click', () => setTool('highlighter'));
    document.getElementById('toolText').addEventListener('click', () => setTool('text'));
    document.getElementById('toolEraser').addEventListener('click', () => setTool('eraser'));
    document.getElementById('annotationColor').addEventListener('input', (e) => strokeColor = e.target.value);

    document.getElementById('clearAnnotations').addEventListener('click', function() {
        const wrapper = viewerContainer.querySelector('[data-page-num="' + currentPageNum + '"]');
        if (wrapper) {
            const canvas = wrapper.querySelector('.annotation-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                localStorage.removeItem(getAnnotationStorageKey(currentPageNum));
            }
            wrapper.querySelectorAll('.pdf-text-note').forEach(n => n.remove());
        }
    });

    document.getElementById('openNewTab').addEventListener('click', function() {
        if (fileUrl) {
            window.open(fileUrl, '_blank');
        }
    });

    function scrollToPage(pageNum) {
        if (pageNum < 1 || pageNum > totalPages) return;
        const wrapper = viewerContainer.querySelector('[data-page-num="' + pageNum + '"]');
        if (wrapper) {
            wrapper.scrollIntoView({ behavior: 'auto', block: 'start' });
            viewerContainer.scrollTop = Math.max(0, viewerContainer.scrollTop - 10);
            currentPageNum = pageNum;
            pageNumInput.value = pageNum;
        }
    }

    let scrollTimeout;
    viewerContainer.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(function() {
            const containerRect = viewerContainer.getBoundingClientRect();
            const midpoint = containerRect.top + containerRect.height * 0.3;
            for (let i = 0; i < pagePlaceholders.length; i++) {
                const rect = pagePlaceholders[i].getBoundingClientRect();
                if (rect.bottom > midpoint) {
                    const newPage = i + 1;
                    if (newPage !== currentPageNum) {
                        currentPageNum = newPage;
                        pageNumInput.value = newPage;
                    }
                    break;
                }
            }
        }, 80);
    });

    document.getElementById('prevPage').addEventListener('click', function() {
        if (currentPageNum > 1) scrollToPage(currentPageNum - 1);
    });
    document.getElementById('nextPage').addEventListener('click', function() {
        if (currentPageNum < totalPages) scrollToPage(currentPageNum + 1);
    });

    pageNumInput.addEventListener('change', function() {
        const p = parseInt(pageNumInput.value);
        if (p >= 1 && p <= totalPages) scrollToPage(p);
        else pageNumInput.value = currentPageNum;
    });

    document.getElementById('zoomOut').addEventListener('click', function() {
        const idx = zoomSelect.selectedIndex;
        if (idx > 0) { zoomSelect.selectedIndex = idx - 1; zoomSelect.dispatchEvent(new Event('change')); }
    });
    document.getElementById('zoomIn').addEventListener('click', function() {
        const idx = zoomSelect.selectedIndex;
        if (idx < zoomSelect.options.length - 1) { zoomSelect.selectedIndex = idx + 1; zoomSelect.dispatchEvent(new Event('change')); }
    });
    zoomSelect.addEventListener('change', function() {
        currentScale = zoomSelect.value;
        const savedPage = currentPageNum;
        setupPlaceholders().then(function() {
            setTimeout(function() { scrollToPage(savedPage); }, 50);
        });
    });

    window.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'goToPage') {
            const page = parseInt(e.data.page);
            if (page >= 1 && page <= totalPages) {
                scrollToPage(page);
            }
        }
        if (e.data && e.data.type === 'loadPdf' && e.data.url && !pdfDoc) {
            loadDocument(e.data.url);
        }
    });

    if (fileUrl) {
        loadDocument(decodeURIComponent(fileUrl));
    }
})();
</script>
</body>
</html>
